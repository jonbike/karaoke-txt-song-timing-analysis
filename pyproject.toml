[project]
name = "karaoke-txt-song-timing-analysis"
version = "0.3.5"
description = "Analyze UltraStar karaoke charts against audio to estimate GAP and BPM corrections."
authors = [
    {name = "Jonathan Moore",email = "jonbike@jonathanmoore.eu"}
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.14"
dependencies = [
    "argparse (>=1.4.0,<2.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "whisperx (>=3.8.6,<4.0.0) ; sys_platform == 'linux' or sys_platform == 'win32'",
    "korean-romanizer (>=0.28.0,<0.29.0)",
    "demucs (>=4.1.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.5.1"
